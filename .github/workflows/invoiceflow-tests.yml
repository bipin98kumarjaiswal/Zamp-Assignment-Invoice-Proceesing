name: InvoiceFlow tests
on:
  pull_request:
    paths:
      - "InvoiceFlow/InvoiceFlow-AI/**"
      - ".github/workflows/invoiceflow-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InvoiceFlow/InvoiceFlow-AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
